---
- name: Verify defaults
  hosts: all
  become: true

  tasks:
    - name: Get UFW status
      ansible.builtin.command: ufw status verbose
      register: ufw_status
      changed_when: false

    - name: Print UFW status for debugging
      ansible.builtin.debug:
        var: ufw_status.stdout

    - name: Verify UFW is active
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status.stdout"

    - name: Verify default incoming policy is allow
      ansible.builtin.assert:
        that:
          - "'allow (incoming)' in ufw_status.stdout"

    - name: Verify default outgoing policy is allow
      ansible.builtin.assert:
        that:
          - "'allow (outgoing)' in ufw_status.stdout"

    - name: Verify logging is off
      ansible.builtin.assert:
        that:
          - "'Logging: off' in ufw_status.stdout"

    - name: Verify SSH (port 22) is always allowed
      ansible.builtin.assert:
        that:
          - "ufw_status.stdout is regex('22/tcp\\s+ALLOW IN\\s+Anywhere')"
        fail_msg: "SSH port 22 is not allowed — risk of lockout!"
